[project]
name = "jobagent"
version = "0.4.0"
description = "Persoenlicher Agent, der taeglich neue Stellenanzeigen sucht, bewertet und als Markdown-Report liefert."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobagent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
# Typannotationen gelten für den Produktivcode; Tests, Fixtures und Fakes bleiben schlank.
"tests/**" = ["ANN"]
